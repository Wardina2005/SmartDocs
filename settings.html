<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDocs - Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="brand">
        <i class="bi bi-file-earmark-text-fill fs-3 text-success"></i>
        <h1 class="brand-title">SmartDocs</h1>
      </div>
      <ul class="sidebar-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a href="documents.html" class="nav-link"><i class="bi bi-folder-symlink-fill"></i> Documents</a></li>
        <li class="nav-item"><a href="upload.html" class="nav-link"><i class="bi bi-camera-fill"></i> Direct Scan & OCR</a></li>
        <li class="nav-item"><a href="reports.html" class="nav-link"><i class="bi bi-bar-chart-line-fill"></i> Reports</a></li>
        <li class="nav-item"><a href="activity-log.html" class="nav-link"><i class="bi bi-clock-history"></i> Activity Log</a></li>
        <li class="nav-item"><a href="settings.html" class="nav-link active"><i class="bi bi-gear-fill"></i> Settings</a></li>
      </ul>
      <div class="p-3">
        <a href="index.html" class="nav-link text-white-50 d-flex align-items-center gap-2"><i class="bi bi-box-arrow-left"></i> Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-navbar">
        <h5 class="fw-bold mb-0">System Preferences</h5>
      </header>

      <div class="p-4">
        <div class="custom-card p-4 col-lg-8">
          <h5 class="fw-bold mb-3">AI & OCR Settings</h5>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="autoProcess" checked>
            <label class="form-check-label" for="autoProcess">Auto-run OCR scan on document capture</label>
          </div>
          <button class="btn btn-primary-green" onclick="App.showNotification('Settings updated!')">Save Settings</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
