<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDocs - Review OCR Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="brand"><i class="bi bi-file-earmark-text-fill fs-3 text-success"></i><h1 class="brand-title">SmartDocs</h1></div>
      <ul class="sidebar-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a href="documents.html" class="nav-link"><i class="bi bi-folder-symlink-fill"></i> Documents</a></li>
        <li class="nav-item"><a href="upload.html" class="nav-link"><i class="bi bi-cloud-arrow-up-fill"></i> Upload Document</a></li>
        <li class="nav-item"><a href="ocr-processing.html" class="nav-link"><i class="bi bi-cpu-fill"></i> OCR Scanner</a></li>
        <li class="nav-item"><a href="reports.html" class="nav-link"><i class="bi bi-bar-chart-line-fill"></i> Reports</a></li>
        <li class="nav-item"><a href="activity-log.html" class="nav-link"><i class="bi bi-clock-history"></i> Activity Log</a></li>
        <li class="nav-item"><a href="settings.html" class="nav-link"><i class="bi bi-gear-fill"></i> Settings</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="top-navbar">
        <h5 class="fw-bold mb-0">Review OCR Extraction</h5>
        <button onclick="commitDocument()" class="btn btn-primary-green"><i class="bi bi-check-circle me-1"></i> Save Document</button>
      </header>

      <div class="p-4">
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="custom-card p-3 h-100 d-flex flex-column">
              <span class="fw-bold text-muted mb-3" id="viewerFileName">Preview Canvas</span>
              <div class="bg-dark text-white rounded-3 flex-grow-1 d-flex flex-column align-items-center justify-content-center p-4" style="min-height: 380px;">
                <i class="bi bi-file-earmark-pdf text-danger display-1 mb-2"></i>
                <p class="text-white-50 small">[ PDF Renderer Stream ]</p>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="custom-card p-4">
              <h5 class="fw-bold mb-3 border-bottom pb-2">Extracted Information</h5>
              <form class="row g-3">
                <div class="col-md-6"><label class="form-label small fw-semibold">Document Name</label><input type="text" id="docName" class="form-control" value="Document.pdf"></div>
                <div class="col-md-6"><label class="form-label small fw-semibold">Vendor</label><input type="text" id="docVendor" class="form-control" value="ACME Corp"></div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Category</label>
                  <select id="docCategory" class="form-select"><option selected>Invoice</option><option>Tax</option><option>Contract</option></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Division</label>
                  <select id="docDivision" class="form-select"><option selected>Finance</option><option>Legal</option></select>
                </div>
                <div class="col-md-6"><label class="form-label small fw-semibold">Amount</label><input type="text" id="docAmount" class="form-control" value="$4,250.00"></div>
                <div class="col-md-6"><label class="form-label small fw-semibold">Date</label><input type="date" id="docDate" class="form-control" value="2026-03-28"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const file = sessionStorage.getItem('pending_ocr_filename');
      if (file) {
        document.getElementById('docName').value = file;
        document.getElementById('viewerFileName').innerText = file;
      }
    });

    function commitDocument() {
      const doc = {
        id: 'DOC-' + Math.floor(1000 + Math.random() * 9000),
        name: document.getElementById('docName').value,
        category: document.getElementById('docCategory').value,
        division: document.getElementById('docDivision').value,
        vendor: document.getElementById('docVendor').value,
        amount: document.getElementById('docAmount').value,
        date: document.getElementById('docDate').value,
        status: 'Approved'
      };

      Store.addDocument(doc);
      App.showNotification('Document saved to repository!');
      setTimeout(() => { window.location.href = 'documents.html'; }, 1000);
    }
  </script>
</body>
</html>
