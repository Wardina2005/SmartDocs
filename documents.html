<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDocs - Documents Repository</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .doc-card { cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .doc-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="brand">
        <i class="bi bi-file-earmark-text-fill fs-3 text-success"></i>
        <h1 class="brand-title">SmartDocs</h1>
      </div>
      <ul class="sidebar-menu">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
        <li class="nav-item"><a href="documents.html" class="nav-link active"><i class="bi bi-folder-symlink-fill"></i> Documents</a></li>
        <li class="nav-item"><a href="upload.html" class="nav-link"><i class="bi bi-camera-fill"></i> Direct Scan & OCR</a></li>
        <li class="nav-item"><a href="reports.html" class="nav-link"><i class="bi bi-bar-chart-line-fill"></i> Reports</a></li>
        <li class="nav-item"><a href="activity-log.html" class="nav-link"><i class="bi bi-clock-history"></i> Activity Log</a></li>
        <li class="nav-item"><a href="settings.html" class="nav-link"><i class="bi bi-gear-fill"></i> Settings</a></li>
      </ul>
      <div class="p-3">
        <a href="index.html" class="nav-link text-white-50 d-flex align-items-center gap-2"><i class="bi bi-box-arrow-left"></i> Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-navbar">
        <div class="search-input-group">
          <i class="bi bi-search"></i>
          <input type="text" id="searchDocInput" class="form-control" placeholder="Search files...">
        </div>
      </header>

      <div class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0">Document Repository</h4>
          <a href="upload.html" class="btn btn-primary-green"><i class="bi bi-camera-fill me-1"></i> Scan File</a>
        </div>

        <div class="row g-3" id="documentsGrid"></div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="docPreviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold" id="modalDocTitle">Document Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row g-4">
            <div class="col-md-6">
              <div class="bg-dark text-white rounded-3 p-4 d-flex flex-column align-items-center justify-content-center h-100" style="min-height: 250px;">
                <i class="bi bi-file-earmark-pdf text-danger display-1 mb-2"></i>
                <p class="text-white-50 small mb-0">[ Document Preview ]</p>
              </div>
            </div>
            <div class="col-md-6">
              <ul class="list-group list-group-flush small">
                <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Vendor:</span><strong id="modalVendor">-</strong></li>
                <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Category:</span><span id="modalCategory" class="badge bg-light-green">-</span></li>
                <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Division:</span><strong id="modalDivision">-</strong></li>
                <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Date:</span><span id="modalDate">-</span></li>
                <li class="list-group-item d-flex justify-content-between"><span class="text-muted">Status:</span><span id="modalStatus" class="badge bg-success-subtle text-success">-</span></li>
              </ul>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top-0 pt-0">
          <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary-green" onclick="App.showNotification('File downloaded!')"><i class="bi bi-download me-1"></i> Download File</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    let previewModal;
    document.addEventListener('DOMContentLoaded', () => {
      previewModal = new bootstrap.Modal(document.getElementById('docPreviewModal'));
      renderDocuments();
    });

    function renderDocuments() {
      const docs = Store.getDocuments();
      const grid = document.getElementById('documentsGrid');

      if (docs.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Belum ada dokumen.</div>';
        return;
      }

      grid.innerHTML = docs.map((doc, index) => `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="custom-card doc-card p-3 h-100 d-flex flex-column justify-content-between" onclick="openDocModal(${index})">
            <div>
              <div class="d-flex align-items-center justify-content-between mb-3">
                <span class="badge bg-light-green">${doc.category || 'General'}</span>
                <button class="btn btn-link text-muted p-0" onclick="event.stopPropagation();"><i class="bi bi-three-dots-vertical"></i></button>
              </div>
              <div class="text-center py-3 bg-light rounded-3 mb-3">
                <i class="bi bi-file-earmark-pdf-fill text-danger display-4"></i>
              </div>
              <h6 class="fw-bold text-truncate mb-1">${doc.name}</h6>
              <p class="text-muted small mb-0">Vendor: ${doc.vendor || 'N/A'}</p>
            </div>
            <div class="border-top pt-3 mt-3 d-flex justify-content-between align-items-center">
              <span class="text-muted small">${doc.date}</span>
              <span class="badge bg-success-subtle text-success">${doc.status || 'Verified'}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openDocModal(index) {
      const docs = Store.getDocuments();
      const doc = docs[index];
      if (doc) {
        document.getElementById('modalDocTitle').innerText = doc.name;
        document.getElementById('modalVendor').innerText = doc.vendor || 'N/A';
        document.getElementById('modalCategory').innerText = doc.category || 'General';
        document.getElementById('modalDivision').innerText = doc.division || 'Finance';
        document.getElementById('modalDate').innerText = doc.date || '-';
        document.getElementById('modalStatus').innerText = doc.status || 'Verified';
        previewModal.show();
      }
    }
  </script>
</body>
</html>
