<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDocs - OCR Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="ocr-loader-overlay text-center">
    <div class="spinner-border text-success mb-4" style="width: 4rem; height: 4rem;" role="status"></div>
    <h3 class="fw-bold mb-2">SmartDocs OCR AI Engine</h3>
    <p class="text-white-50 fs-5 mb-4" id="statusStep">Uploading Document...</p>
    
    <div class="progress w-50" style="height: 10px; background-color: rgba(255,255,255,0.2);">
      <div id="ocrProgressBar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
    </div>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const steps = [
        { pct: 25, text: 'Uploading Document to Service...' },
        { pct: 50, text: 'Detecting Text Boundaries...' },
        { pct: 75, text: 'Extracting Metadata Attributes...' },
        { pct: 100, text: 'AI Extraction Completed!' }
      ];

      let current = 0;
      const bar = document.getElementById('ocrProgressBar');
      const text = document.getElementById('statusStep');

      const interval = setInterval(() => {
        if (current < steps.length) {
          bar.style.width = steps[current].pct + '%';
          text.innerText = steps[current].text;
          current++;
        } else {
          clearInterval(interval);
          setTimeout(() => { window.location.href = 'ocr-result.html'; }, 500);
        }
      }, 700);
    });
  </script>
</body>
</html>
